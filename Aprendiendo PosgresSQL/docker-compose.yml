services:

  postgreSQL:
      image: postgres
      container_name: postgreSQL_db1
      restart: always
      environment:
        POSTGRES_USER: root
        POSTGRES_PASSWORD: root
        POSTGRES_DB: Aprendiendo_PosgreSQL
      ports:
        - "5432:5432"
      volumes:
        - postgreSQL_data:/var/lib/postgresql/data
volumes:
  postgreSQL_data: